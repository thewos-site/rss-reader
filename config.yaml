# LLM 配置
#llm:
#  provider: "claude"
#  model: "claude-sonnet-4-20250514"
#  api_key: "${ANTHROPIC_API_KEY}"
#  base_url: "${ANTHROPIC_BASE_URL}"

llm:
  provider: "openai"
  model: "kimi-k2.5"
  api_key: "${OPENAI_API_KEY}"
  base_url: "${OPENAI_BASE_URL}"

  # 摘要 prompt
  summary_prompt: |
    请用中文为以下文章生成结构化摘要，包括将标题翻译成中文：

    原标题：{title}
    内容：{content}

    请严格按以下格式输出（不要添加其他内容）：

    🏷️ [中文标题翻译]

    📌 [一句话核心观点，不超过30字]

    💡 为什么值得关注:
    [1-2句话说明]

    📋 关键要点:
    • [要点1]
    • [要点2]
    • [要点3]
    
    🔗原文链接：
    
    ⭐ 推荐: [值得精读 / 建议浏览 / 可跳过]

# 推送配置
notify:
  # Telegram
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"


# 运行配置
schedule:
  interval_minutes: 60  # 每小时检查一次
  max_articles_per_run: 10  # 每次最多处理10篇
  max_age_hours: 24  # 只处理最近24小时内的文章
